<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="iconHazard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="50%" stop-color="#ff5500" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="iconGlow">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Chassis Frame -->
  <rect width="200" height="200" rx="36" fill="url(#iconBg)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Outer Orbit Rings -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="rgba(0, 240, 255, 0.15)" stroke-width="1.5" stroke-dasharray="6 4" />
  <circle cx="100" cy="100" r="62" fill="none" stroke="rgba(255, 0, 85, 0.2)" stroke-width="1" />

  <!-- Hexagonal Core -->
  <polygon points="100,45 145,72 145,128 100,155 55,128 55,72" fill="rgba(15, 23, 42, 0.9)" stroke="url(#iconHazard)" stroke-width="2.5" filter="url(#iconGlow)" />

  <!-- Danger Triangle Indicator -->
  <polygon points="100,68 126,118 74,118" fill="none" stroke="#ff0055" stroke-width="2.8" />
  <line x1="100" y1="80" x2="100" y2="103" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <circle cx="100" cy="111" r="2" fill="#ffffff" />

  <!-- Corner Tech Notches -->
  <path d="M 16 34 L 16 16 L 34 16" stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 184 34 L 184 16 L 166 16" stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 16 166 L 16 184 L 34 184" stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 184 166 L 184 184 L 166 184" stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.6" />
</svg>
